<style>
:root{
  --azul-950:#071633; --azul-900:#0b2250; --azul-800:#0f3278; --azul-700:#1246a8;
  --azul-600:#1d5fd6; --azul-500:#2f7bf5; --azul-300:#8bb8ff; --azul-100:#e6efff; --azul-50:#f3f7fe;
  --texto:#16233f; --suave:#5a6985; --borde:#d9e4f7; --blanco:#fff;
  --sombra:0 6px 24px rgba(15,50,120,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;background:var(--azul-50);color:var(--texto);line-height:1.65}
a{color:var(--azul-600)}
.contenedor{max-width:1110px;margin:0 auto;padding:0 20px 40px}

/* ---------- cabecera ---------- */
.franja{background:var(--azul-950);color:#cfe0ff;font-size:.78rem}
.franja div{max-width:1110px;margin:auto;padding:7px 20px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.franja b{background:var(--azul-600);color:#fff;padding:1px 8px;border-radius:3px;margin-right:8px;font-size:.7rem;letter-spacing:.05em}
.marca{background:#fff}
.marca div{max-width:1110px;margin:auto;padding:18px 20px}
.marca h1{font-family:'Fraunces',Georgia,serif;font-size:clamp(1.5rem,4vw,2.3rem);color:var(--azul-700);letter-spacing:-.01em;line-height:1.15}
.marca p{font-size:.72rem;letter-spacing:.16em;color:var(--suave);text-transform:uppercase;font-weight:600;margin-top:4px}
.menu{background:var(--azul-700);position:sticky;top:0;z-index:50;box-shadow:0 3px 12px rgba(7,22,51,.25)}
.menu ul{max-width:1110px;margin:auto;padding:0 12px;list-style:none;display:flex;overflow-x:auto;scrollbar-width:none}
.menu ul::-webkit-scrollbar{display:none}
.menu a{display:block;padding:14px 12px;color:#fff;text-decoration:none;font-weight:700;font-size:.8rem;text-transform:uppercase;white-space:nowrap;border-bottom:3px solid transparent;transition:.2s}
.menu a:hover,.menu a.activo{background:var(--azul-800);border-bottom-color:var(--azul-300)}

/* ---------- secciones ---------- */
section{scroll-margin-top:62px;margin-top:46px}
.titulo{border-left:5px solid var(--azul-600);padding-left:12px;margin-bottom:22px}
.titulo h2{font-size:1.15rem;text-transform:uppercase;letter-spacing:.01em;color:var(--azul-900)}
.titulo p{color:var(--suave);font-size:.92rem;margin-top:2px}
.tarjeta{background:#fff;border:1px solid var(--borde);border-top:3px solid var(--azul-600);border-radius:6px;padding:22px;box-shadow:var(--sombra)}
.tarjeta h3{font-family:'Fraunces',Georgia,serif;font-size:1.25rem;color:var(--azul-900);line-height:1.25;margin-bottom:8px}
.tarjeta p+p{margin-top:10px}
.etiqueta{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--azul-600);margin-bottom:8px}
.rejilla{display:grid;gap:22px}
.rejilla.dos{grid-template-columns:repeat(2,1fr)}
.rejilla.tres{grid-template-columns:repeat(3,1fr)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.chip{background:var(--azul-100);color:var(--azul-800);font-size:.76rem;font-weight:600;padding:4px 11px;border-radius:99px}
.boton{display:inline-block;margin-top:14px;background:var(--azul-600);color:#fff;padding:9px 18px;border-radius:5px;font-weight:700;font-size:.85rem;text-decoration:none;transition:.2s}
.boton:hover{background:var(--azul-800)}
.boton.claro{background:transparent;border:1.5px solid var(--azul-300);color:#fff}
.boton.claro:hover{background:rgba(255,255,255,.12)}

/* ---------- inicio ---------- */
.portada{margin-top:22px;background:linear-gradient(135deg,var(--azul-950),var(--azul-800));color:#fff;border-radius:8px;border-left:6px solid var(--azul-500);padding:42px 38px;display:flex;gap:34px;align-items:center;box-shadow:var(--sombra);position:relative;overflow:hidden}
.portada::after{content:"";position:absolute;right:-90px;top:-90px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(47,123,245,.35),transparent 70%)}
.insignia{background:var(--azul-600);display:inline-block;padding:3px 10px;border-radius:3px;font-size:.7rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.portada h2{font-family:'Fraunces',Georgia,serif;font-size:clamp(2rem,5.5vw,3.3rem);line-height:1.1;margin:12px 0 10px}
.portada h2 em{color:var(--azul-300);font-style:normal}
.portada p.sub{font-size:1.08rem;color:#d5e4ff;max-width:560px}
.portada .botones{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.avatar{flex:0 0 190px;height:190px;border-radius:50%;background:linear-gradient(145deg,var(--azul-500),var(--azul-700));border:5px solid rgba(255,255,255,.2);display:grid;place-items:center;font-family:'Fraunces',serif;font-size:4.2rem;font-weight:800;position:relative;z-index:1}
.datos{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}
.dato{background:#fff;border:1px solid var(--borde);border-radius:6px;padding:16px;text-align:center}
.dato b{display:block;font-family:'Fraunces',serif;font-size:1.5rem;color:var(--azul-600)}
.dato span{font-size:.8rem;color:var(--suave)}

/* ---------- línea de tiempo ---------- */
.linea{position:relative;padding:10px 0}
.linea::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:4px;background:linear-gradient(var(--azul-300),var(--azul-600));transform:translateX(-50%);border-radius:4px}
.hito{position:relative;width:50%;padding:0 38px 34px 0}
.hito:nth-child(even){margin-left:50%;padding:0 0 34px 38px}
.hito::before{content:"";position:absolute;right:-11px;top:22px;width:20px;height:20px;border-radius:50%;background:#fff;border:5px solid var(--azul-600);box-shadow:0 0 0 5px var(--azul-100);z-index:2}
.hito:nth-child(even)::before{right:auto;left:-9px}
.hito.actual::before{background:var(--azul-500);animation:pulso 1.8s infinite}
@keyframes pulso{0%{box-shadow:0 0 0 0 rgba(47,123,245,.55)}100%{box-shadow:0 0 0 14px rgba(47,123,245,0)}}
.hito .tarjeta{transition:.25s}
.hito .tarjeta:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(15,50,120,.18)}
.fecha{display:inline-block;background:var(--azul-900);color:#fff;font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:3px;margin-bottom:10px;letter-spacing:.04em}
.hito.actual .fecha{background:var(--azul-500)}

/* ---------- varios ---------- */
.destacado{background:var(--azul-900);color:#e6efff;border-radius:8px;padding:26px 30px;border-left:6px solid var(--azul-500);box-shadow:var(--sombra)}
.destacado h3{font-family:'Fraunces',serif;color:#fff;margin-bottom:8px}
.cita{font-family:'Fraunces',serif;font-size:1.2rem;color:var(--azul-900);border-left:4px solid var(--azul-500);padding-left:16px;margin-top:20px}
.lugar{border-top-color:var(--azul-500)}
.lugar .emoji{font-size:2rem;display:block;margin-bottom:6px}
.lista{list-style:none;margin-top:8px}
.lista li{padding:8px 0 8px 26px;position:relative;border-bottom:1px dashed var(--borde)}
.lista li:last-child{border:none}
.lista li::before{content:"▸";position:absolute;left:4px;color:var(--azul-600)}
.pie{background:var(--azul-950);color:#a9c3f0;text-align:center;padding:30px 20px;font-size:.88rem;margin-top:30px}
.pie b{color:#fff}

/* ---------- móvil ---------- */
@media(max-width:820px){
  .rejilla.dos,.rejilla.tres{grid-template-columns:1fr}
  .datos{grid-template-columns:repeat(2,1fr)}
  .portada{flex-direction:column-reverse;padding:30px 22px;text-align:center}
  .portada .botones{justify-content:center}
  .avatar{flex-basis:auto;width:130px;height:130px;font-size:3rem}
  .linea::before{left:14px}
  .hito,.hito:nth-child(even){width:100%;margin-left:0;padding:0 0 28px 44px}
  .hito::before,.hito:nth-child(even)::before{left:5px;right:auto}
}
.aparece{opacity:0;transform:translateY(18px);transition:.6s}
.aparece.visto{opacity:1;transform:none}
</style>
